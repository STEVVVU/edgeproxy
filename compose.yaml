# Containerized demo stack: edgeproxy in front of two upstream fixtures, scraped
# by Prometheus.
#
#   docker compose up --build
#
#   curl http://localhost:8080/           # proxied, round robin over both
#   curl -k https://localhost:8443/       # same, TLS-terminated (-k: self-signed)
#   curl http://localhost:9090/metrics    # edgeproxy metrics
#   open http://localhost:9091            # Prometheus UI
#
# `scripts/demo.ps1` runs the same topology as plain local processes when Docker
# is not wanted; this file is the containerized equivalent and additionally runs
# Prometheus for you.
#
# The TLS certificate is generated on first run into a named volume by the
# `certgen` init container, so no key material is committed. It is a throwaway
# self-signed certificate for localhost and is not fit for any other use.

name: edgeproxy

services:
  # Generates a throwaway self-signed certificate if one is not already present.
  # Runs to completion before the proxy starts.
  certgen:
    image: alpine/openssl:3.3.2
    networks: [edge]
    volumes:
      - tls-certs:/certs
    # `sh -c` so the "already exists" short-circuit works; this image's
    # entrypoint is openssl itself, hence the override.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /certs/test-only-localhost.crt ]; then
          echo "certificate already present, skipping generation"
          exit 0
        fi
        openssl req -x509 -newkey rsa:2048 -sha256 -days 30 -nodes \
          -keyout /certs/test-only-localhost.key \
          -out /certs/test-only-localhost.crt \
          -subj "/CN=localhost/O=edgeproxy test only" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        chmod 0644 /certs/test-only-localhost.crt
        # World-readable so the nonroot proxy user can read it. Acceptable only
        # because this key is a disposable local-demo artifact.
        chmod 0644 /certs/test-only-localhost.key
        echo "generated throwaway self-signed certificate for localhost"

  # Static IPs because edgeproxy's `upstreams[].address` is a SocketAddr: it does
  # no DNS resolution, so compose service names cannot be used there.
  upstream-a:
    build:
      context: .
      dockerfile: Dockerfile.fixture
    command: ["--listen", "0.0.0.0:8000", "--id", "a"]
    networks:
      edge:
        ipv4_address: 172.28.1.11
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  upstream-b:
    build:
      context: .
      dockerfile: Dockerfile.fixture
    command: ["--listen", "0.0.0.0:8000", "--id", "b"]
    networks:
      edge:
        ipv4_address: 172.28.1.12
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  edgeproxy:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      certgen:
        condition: service_completed_successfully
      upstream-a:
        condition: service_started
      upstream-b:
        condition: service_started
    networks: [edge]
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9090:9090"
    volumes:
      - ./deploy/edgeproxy.compose.toml:/etc/edgeproxy/edgeproxy.toml:ro
      - tls-certs:/etc/edgeproxy/certs:ro
    environment:
      RUST_LOG: edgeproxy=info
    # The proxy writes nothing to disk, so it runs fully read-only with no
    # capabilities. This is the posture the Dockerfile's nonroot user assumes.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.1.0
    depends_on:
      edgeproxy:
        condition: service_started
    networks: [edge]
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1h"

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

volumes:
  tls-certs:
