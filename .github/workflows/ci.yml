name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      # Benchmarks are compiled but not measured: CI runners are too noisy for
      # meaningful timings. This only guards against a bench that stops building.
      - name: Benchmarks compile
        run: cargo build --locked --benches

  msrv:
    # Raised from 1.78 to 1.86 by criterion 0.7, the highest MSRV among the new
    # dependencies. rustls/tokio-rustls/metrics themselves only need 1.71.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Build at MSRV
        run: cargo build --locked --all-targets

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
