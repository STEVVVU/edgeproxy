name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # `cargo test` exits 0 when it discovers nothing, so a refactor that stops
  # tests being collected would keep CI green while testing nothing. Assert the
  # count instead. This is a floor, not an exact count: raise it when tests are
  # added, never lower it to make a red build pass.
  MIN_TESTS: 36

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # For scripts/check_documented_metrics.py below. Pinned rather than relying
      # on the runner image's default, which provides `python3` but not always
      # `python`, and which moves without notice.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      # Guards against a vacuous pass. Runs the suite a second time (cached, so
      # it is a re-run of the binaries rather than a rebuild) and sums the
      # per-binary "test result: ok. N passed" lines.
      - name: Assert the suite is not empty
        shell: bash
        run: |
          set -euo pipefail
          # Summed with awk rather than bc: bc is absent from the Windows runner,
          # and keeping one implementation avoids the two drifting apart.
          total=$(cargo test --locked --all-targets 2>&1 \
            | awk '/^test result: ok\./ { sum += $4 } END { print sum + 0 }')
          echo "tests passed: ${total} (floor: ${MIN_TESTS})"
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Expected at least ${MIN_TESTS} passing tests, saw ${total}." \
                 "Either tests were removed or they stopped being discovered."
            exit 1
          fi
      # Benchmarks are compiled but not measured: CI runners are too noisy for
      # meaningful timings. This only guards against a bench that stops building.
      - name: Benchmarks compile
        run: cargo build --locked --benches

      # criterion writes into target/, which is gitignored, so for a while every
      # median in benchmark/RESULTS.md had no committed producer and no committed
      # artifact: a reader could check nothing, and nothing would notice an edited
      # figure. The estimates for all 18 cases are committed under
      # benchmark/criterion/ now, and this asserts the table still agrees with
      # them. It measures nothing and does not run cargo bench.
      - name: Check the published medians against the committed estimates
        run: python scripts/check_documented_metrics.py

      # Proves the check above can fail, for the same reason the encoding and
      # test-count guards carry one: a guard only ever observed to pass is
      # indistinguishable from a guard that cannot fail, and an unbacked table row
      # is precisely what this one exists to catch. Perturbs one published median
      # by a single displayed digit, requires a non-zero exit, then restores the
      # file and requires a zero exit.
      - name: Assert the metrics check rejects a perturbed median
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark/RESULTS.md "${RUNNER_TEMP}/RESULTS.md.orig"
          restore() { cp "${RUNNER_TEMP}/RESULTS.md.orig" benchmark/RESULTS.md; }
          trap restore EXIT
          # newline="" on both sides so the rewrite cannot introduce CRLF and
          # fail for an unrelated reason.
          python - <<'PY'
          import io
          path = "benchmark/RESULTS.md"
          text = io.open(path, encoding="utf-8", newline="").read()
          old, new = "| 5.28 us | [5.00–5.73] |", "| 5.29 us | [5.00–5.73] |"
          if old not in text:
              raise SystemExit(
                  "canary: the header_count/16 row is not in its expected form, so "
                  "this negative test would perturb nothing. Update the literal."
              )
          io.open(path, "w", encoding="utf-8", newline="").write(text.replace(old, new, 1))
          PY
          if python scripts/check_documented_metrics.py; then
            echo "::error::The metrics check accepted a perturbed median;" \
                 "the guard is vacuous."
            exit 1
          fi
          echo "perturbed median correctly rejected"
          restore
          trap - EXIT
          python scripts/check_documented_metrics.py
          echo "restored file correctly accepted"

  # The measurement harnesses are Windows PowerShell, so a Linux-only matrix
  # never executes them. That is how the UTF-16LE/BOM defect in the report writer
  # shipped in the first place: `Tee-Object -FilePath` under PowerShell 5.1 wrote
  # unparseable JSON while the console output looked correct and the script still
  # exited 0. This job runs the writers for real and asserts the bytes on disk.
  harness-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked --all-targets

      # Same floor as the Linux job: a target that only fails to be discovered
      # on Windows is exactly the kind of gap this job exists to close.
      - name: Assert the suite is not empty
        shell: bash
        run: |
          set -euo pipefail
          total=$(cargo test --locked --all-targets 2>&1 \
            | awk '/^test result: ok\./ { sum += $4 } END { print sum + 0 }')
          echo "tests passed: ${total} (floor: ${MIN_TESTS})"
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Expected at least ${MIN_TESTS} passing tests, saw ${total}." \
                 "Either tests were removed or they stopped being discovered."
            exit 1
          fi

      # Deliberately Windows PowerShell 5.1 (`powershell`, not `pwsh`): 5.1 is
      # the shell whose cmdlets emit the BOM, and it is what a Windows user gets
      # by default. Checking under pwsh 7 would test the wrong encoder.
      - name: Benchmark harness writes a BOM-free report
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $PSVersionTable.PSVersion.ToString()
          # A small request count: this asserts the writer's encoding, not
          # performance. No timing from a shared CI runner is published.
          .\scripts\benchmark.ps1 -Requests 200 -Concurrency 1
          if ($LASTEXITCODE -ne 0) { throw "benchmark.ps1 exited $LASTEXITCODE" }
          .\scripts\Assert-TextEncoding.ps1 -Path benchmark/latest.json -Json

      # openssl ships with the hosted Windows runner (Git for Windows), so the
      # TLS leg exercises scripts/TestCertificate.ps1 too.
      - name: Benchmark harness writes a BOM-free TLS report
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\benchmark.ps1 -Requests 200 -Concurrency 1 -IncludeTls
          if ($LASTEXITCODE -ne 0) { throw "benchmark.ps1 -IncludeTls exited $LASTEXITCODE" }
          .\scripts\Assert-TextEncoding.ps1 `
            -Path benchmark/latest.json, benchmark/latest-tls.json -Json

      # demo.ps1 blocks on Read-Host until the operator stops it; piping an empty
      # line satisfies that and unwinds into its finally block, which terminates
      # the child processes. The generated TOML is the artifact under test.
      - name: Demo harness writes a BOM-free config
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          "" | .\scripts\demo.ps1 -Upstreams 2 -Tls
          if ($LASTEXITCODE -ne 0) { throw "demo.ps1 exited $LASTEXITCODE" }
          .\scripts\Assert-TextEncoding.ps1 -Path demo/edgeproxy.demo.toml

      # Proves the assertion above can fail. A guard that has only ever been seen
      # to pass is indistinguishable from one that cannot fail, and this one
      # exists solely to catch a regression, so its failure path is the half that
      # matters. Writes a BOM-ful file the way the old code did, requires the
      # check to reject it, and removes it.
      - name: Assert the encoding check rejects a BOM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $withBom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path "bom-canary.json"),
            "{`n  `"canary`": true`n}`n", $withBom)
          $head = ([System.IO.File]::ReadAllBytes("bom-canary.json")[0..2] |
            ForEach-Object { $_.ToString("x2") }) -join " "
          Write-Host "canary head: $head (expected ef bb bf)"
          $rejected = $false
          try { .\scripts\Assert-TextEncoding.ps1 -Path bom-canary.json -Json }
          catch { $rejected = $true; Write-Host "rejected as expected: $($_.Exception.Message)" }
          Remove-Item bom-canary.json -Force
          if (-not $rejected) {
            throw "Assert-TextEncoding.ps1 accepted a BOM-ful file; the guard is vacuous."
          }

      # The same argument for the test-count floor: prove it fails below its
      # floor. `cargo test` with a filter that matches nothing reports 0 passed
      # and exits 0, which is precisely the vacuous case being guarded against.
      - name: Assert the test-count floor rejects an empty run
        shell: bash
        run: |
          set -euo pipefail
          total=$(cargo test --locked --all-targets -- __no_such_test_name__ 2>&1 \
            | awk '/^test result: ok\./ { sum += $4 } END { print sum + 0 }')
          echo "filtered run reported ${total} passing tests (floor: ${MIN_TESTS})"
          if [ "${total}" -ne 0 ]; then
            echo "::error::Expected the filtered run to report 0 tests, saw ${total}."
            exit 1
          fi
          if [ "${total}" -ge "${MIN_TESTS}" ]; then
            echo "::error::The floor did not reject an empty run; the guard is vacuous."
            exit 1
          fi
          echo "floor correctly rejects a run of ${total} tests"

  msrv:
    # Raised from 1.78 to 1.86 by criterion 0.7, the highest MSRV among the new
    # dependencies. rustls/tokio-rustls/metrics themselves only need 1.71.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Build at MSRV
        run: cargo build --locked --all-targets

  # fuzz/ is a separate package with its own lockfile — the root Cargo.toml has
  # no [workspace], so no other job compiles it and its lockfile is not resolved
  # by the root build. It had already drifted: the committed fuzz/Cargo.lock
  # predated the rustls and metrics dependencies, so `--locked` could not
  # resolve. Build-only, deliberately: no campaign is run here, because a
  # fixed-budget fuzz run in CI is either too short to find anything or long
  # enough to make every build flaky.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libfuzzer-sys needs -Z sanitizer, so this is the one nightly job.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      # Asserts the committed fuzz/Cargo.lock still resolves. This is the check
      # that catches the drift described above, and it fails fast without needing
      # cargo-fuzz or a sanitizer build.
      - name: Assert the fuzz lockfile is current
        working-directory: fuzz
        run: cargo check --locked --all-targets
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Compiles the target with the sanitizer instrumentation it will actually
      # run under, which `cargo check` alone does not exercise.
      - name: Build fuzz targets
        run: cargo fuzz build --dev
      # A few seconds of fuzzing: enough to prove the harness starts, links, and
      # executes the target against real input, without a time budget that makes
      # the job flaky. -runs is bounded, not wall-clock, so it is deterministic.
      - name: Smoke the fuzz target
        run: cargo fuzz run --dev request_parser -- -runs=2000 -max_total_time=30

  container:
    # Builds the container image for real so the Dockerfile cannot bit-rot
    # unnoticed. The image is loaded into the local daemon (never pushed) and the
    # compose topology is brought up to prove an end-to-end round trip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: edgeproxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build fixture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fixture
          push: false
          load: true
          tags: edgeproxy-fixture:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose smoke test
        run: |
          docker compose up -d --build
          # The proxy only routes once an upstream passes its health checks
          # (healthy_threshold=2 at a 2 s interval), so poll rather than assume.
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8080/ 2>/dev/null || true)
            case "$body" in
              upstream=*) echo "plaintext round trip: $body"; break ;;
            esac
            if [ "$i" = 30 ]; then
              echo "proxy did not return an upstream response in time" >&2
              docker compose logs
              exit 1
            fi
            sleep 1
          done
          tls_body=$(curl -fsSk https://localhost:8443/)
          case "$tls_body" in
            upstream=*) echo "TLS round trip: $tls_body" ;;
            *) echo "unexpected TLS response: $tls_body" >&2; docker compose logs; exit 1 ;;
          esac
      - name: Compose teardown
        if: always()
        run: docker compose down -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
