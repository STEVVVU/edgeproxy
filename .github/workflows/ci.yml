name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      # Benchmarks are compiled but not measured: CI runners are too noisy for
      # meaningful timings. This only guards against a bench that stops building.
      - name: Benchmarks compile
        run: cargo build --locked --benches

  msrv:
    # Raised from 1.78 to 1.86 by criterion 0.7, the highest MSRV among the new
    # dependencies. rustls/tokio-rustls/metrics themselves only need 1.71.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Build at MSRV
        run: cargo build --locked --all-targets

  container:
    # Builds the container image for real so the Dockerfile cannot bit-rot
    # unnoticed. The image is loaded into the local daemon (never pushed) and the
    # compose topology is brought up to prove an end-to-end round trip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: edgeproxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build fixture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fixture
          push: false
          load: true
          tags: edgeproxy-fixture:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose smoke test
        run: |
          docker compose up -d --build
          # The proxy only routes once an upstream passes its health checks
          # (healthy_threshold=2 at a 2 s interval), so poll rather than assume.
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8080/ 2>/dev/null || true)
            case "$body" in
              upstream=*) echo "plaintext round trip: $body"; break ;;
            esac
            if [ "$i" = 30 ]; then
              echo "proxy did not return an upstream response in time" >&2
              docker compose logs
              exit 1
            fi
            sleep 1
          done
          tls_body=$(curl -fsSk https://localhost:8443/)
          case "$tls_body" in
            upstream=*) echo "TLS round trip: $tls_body" ;;
            *) echo "unexpected TLS response: $tls_body" >&2; docker compose logs; exit 1 ;;
          esac
      - name: Compose teardown
        if: always()
        run: docker compose down -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
