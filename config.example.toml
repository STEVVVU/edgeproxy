listen = "0.0.0.0:8080"
metrics_listen = "127.0.0.1:9090"
policy = "least_connections"
max_in_flight = 1024
shutdown_grace_ms = 15000
preserve_host = false

# Optional HTTPS listener (rustls, TLS 1.2 + 1.3). Omit the whole [tls] section
# to run plaintext-only. When present, edgeproxy serves both `listen` (HTTP) and
# `tls.listen` (HTTPS); it does not redirect one to the other.
#
# `certificate` is a PEM chain (leaf first, then any intermediates) and
# `private_key` is a PEM PKCS#8, PKCS#1, or SEC1 key. Certificates are read once
# at startup: rotating them requires a restart.
#
# [tls]
# listen = "0.0.0.0:8443"
# certificate = "/etc/edgeproxy/tls/fullchain.pem"
# private_key = "/etc/edgeproxy/tls/privkey.pem"
#
# Optional per-hostname certificates selected from the TLS SNI extension. The
# top-level certificate above is served when SNI is absent or unmatched.
# `server_name` must be lowercase and unique.
#
# [[tls.sni]]
# server_name = "api.example.com"
# certificate = "/etc/edgeproxy/tls/api-fullchain.pem"
# private_key = "/etc/edgeproxy/tls/api-privkey.pem"

[limits]
max_header_bytes = 16384
max_headers = 64
max_request_line_bytes = 8192
max_body_bytes = 1048576
max_response_header_bytes = 32768

[timeouts]
request_header_ms = 5000
request_body_ms = 10000
connect_ms = 500
upstream_write_ms = 5000
upstream_response_header_ms = 5000
upstream_idle_ms = 15000
downstream_write_ms = 15000

[retries]
max_attempts = 2
retry_statuses = [502, 503, 504]

[circuit_breaker]
failure_threshold = 5
open_ms = 10000

[health_check]
interval_ms = 2000
timeout_ms = 500
unhealthy_threshold = 2
healthy_threshold = 2

# `address` is an IP:port literal. edgeproxy performs no DNS resolution, so the
# request path never depends on a resolver.
[[upstreams]]
name = "api-a"
address = "10.0.0.11:8000"
health_path = "/health"

[[upstreams]]
name = "api-b"
address = "10.0.0.12:8000"
health_path = "/health"

# Optional backend re-encryption: connect to this upstream over TLS.
#
# `tls_server_name` is presented as SNI, verified against the upstream's
# certificate, and used as the outgoing `Host`. Without it, the IP literal is
# verified instead, which requires the certificate to carry an IP SAN.
#
# Trust anchors come from the webpki-roots bundle, so a privately-issued upstream
# certificate will not verify. `tls_insecure_skip_verify` disables chain and
# hostname checks for lab use only and is logged as a warning at startup.
#
# [[upstreams]]
# name = "api-tls"
# address = "10.0.0.13:8443"
# health_path = "/health"
# tls = true
# tls_server_name = "api.internal.example.com"
# tls_insecure_skip_verify = false

