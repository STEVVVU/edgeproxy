# Prometheus configuration for the compose.yaml stack.
#
# The only target is edgeproxy's metrics listener, resolved by compose DNS —
# unlike the proxy's own upstream addresses, which must be IP literals.
# demo/prometheus.yml is the equivalent for the local-process demo.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: edgeproxy
    static_configs:
      - targets: ["edgeproxy:9090"]
