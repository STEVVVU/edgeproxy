# edgeproxy configuration for the compose.yaml stack.
#
# Upstream addresses are IP literals, not service names: `upstreams[].address` is
# a `SocketAddr`, so edgeproxy does no DNS resolution and takes no dependency on
# a resolver in the request path. compose.yaml therefore pins the two fixtures to
# static addresses on a user-defined bridge network.
#
# The certificate paths point at the volume the `certgen` service populates with
# a throwaway self-signed certificate.

listen = "0.0.0.0:8080"
metrics_listen = "0.0.0.0:9090"
policy = "round_robin"
max_in_flight = 1024
shutdown_grace_ms = 15000
preserve_host = false

# HTTPS listener. TLS 1.2 and 1.3 via rustls with the ring provider.
[tls]
listen = "0.0.0.0:8443"
certificate = "/etc/edgeproxy/certs/test-only-localhost.crt"
private_key = "/etc/edgeproxy/certs/test-only-localhost.key"

[limits]
max_header_bytes = 16384
max_headers = 64
max_request_line_bytes = 8192
max_body_bytes = 1048576
max_response_header_bytes = 32768

[timeouts]
request_header_ms = 5000
request_body_ms = 10000
# Higher than the 500 ms default: a container-network connect is slower than a
# loopback one, especially on first contact after startup.
connect_ms = 2000
upstream_write_ms = 5000
upstream_response_header_ms = 5000
upstream_idle_ms = 15000
downstream_write_ms = 15000

[retries]
max_attempts = 2
retry_statuses = [502, 503, 504]

[circuit_breaker]
failure_threshold = 5
open_ms = 10000

[health_check]
interval_ms = 2000
timeout_ms = 1000
unhealthy_threshold = 2
healthy_threshold = 2

# The fixture upstream answers any path with a fixed body, so /health works.
# These addresses match the static IPs assigned in compose.yaml.
[[upstreams]]
name = "upstream-a"
address = "172.28.1.11:8000"
health_path = "/health"

[[upstreams]]
name = "upstream-b"
address = "172.28.1.12:8000"
health_path = "/health"
