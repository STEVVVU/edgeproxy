# Benchmark configuration with the HTTPS listener enabled.
#
# Identical to edgeproxy.bench.toml apart from the [tls] section, so the
# plaintext and TLS measurements differ only in the transport. The certificate is
# generated by `scripts/benchmark.ps1 -IncludeTls` into benchmark/tls/ and is a
# throwaway self-signed certificate for localhost.

listen = "127.0.0.1:18080"
metrics_listen = "127.0.0.1:19090"
policy = "round_robin"
max_in_flight = 1024
shutdown_grace_ms = 5000

[tls]
listen = "127.0.0.1:18443"
certificate = "benchmark/tls/test-only-localhost.crt"
private_key = "benchmark/tls/test-only-localhost.key"

[limits]
max_header_bytes = 16384
max_headers = 64
max_request_line_bytes = 8192
max_body_bytes = 1048576
max_response_header_bytes = 32768

[timeouts]
request_header_ms = 5000
request_body_ms = 10000
connect_ms = 500
upstream_write_ms = 5000
upstream_response_header_ms = 5000
upstream_idle_ms = 15000
downstream_write_ms = 15000

[retries]
max_attempts = 2
retry_statuses = [502, 503, 504]

[circuit_breaker]
failure_threshold = 5
open_ms = 10000

[health_check]
interval_ms = 2000
timeout_ms = 500
unhealthy_threshold = 2
healthy_threshold = 2

[[upstreams]]
name = "fixture-a"
address = "127.0.0.1:19001"
health_path = "/health"

[[upstreams]]
name = "fixture-b"
address = "127.0.0.1:19002"
health_path = "/health"
